name: CI Pipeline

on:
  push:
    branches: [main, staging, 'fix/*', 'feat/*', 'remediation/*']
  pull_request:

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Build Shared Packages
        run: pnpm --filter "@celebs/*" --if-present build

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Linting
        run: pnpm lint

      - name: Format Check
        run: pnpm exec prettier --check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: celebs
          POSTGRES_DB: celebs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Build Shared Packages
        run: pnpm --filter "@celebs/*" --if-present build

      - name: Push Test Database Schema
        run: npx dotenv -e apps/api/.env.test -- npx prisma db push --schema=apps/api/src/db/schema.prisma --config=prisma.config.ts

      - name: Run Unit Tests
        run: pnpm test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Build Monorepo Workspace
        run: pnpm build

      - name: Validate Docker Build (Render parity)
        run: docker build -f Dockerfile -t celebs:ci .

  deploy-staging:
    name: Deploy to Render (Staging)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render staging deployment after successful CI..."
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deploy hook successfully triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping manual deploy hook trigger (using Render native CI checks if configured)."
          fi
