<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 400px;
        padding: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.4;
        background: #fafafa;
        color: #222;
        margin: 0;
      }
      h3 {
        margin: 0 0 12px 0;
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .config-card {
        background: #ffffff;
        padding: 12px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      label {
        font-weight: 500;
        color: #555;
      }
      input,
      select {
        padding: 5px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 12px;
        background: #fff;
      }
      input[type='number'] {
        width: 65px;
        text-align: center;
      }
      .badge {
        background: #e3f2fd;
        color: #0d47a1;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      .status {
        padding: 12px;
        background: #eef9f1;
        border-left: 4px solid #28a745;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 12px;
        color: #155724;
        line-height: 1.5;
      }
      .status.alert {
        background: #fff3cd;
        border-left-color: #ffc107;
        color: #856404;
      }
      button {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        cursor: pointer;
        border-radius: 6px;
        font-weight: 600;
        border: none;
        font-size: 13px;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      #collectBtn {
        background: #111;
        color: #fff;
      }
      #startBtn {
        background: #28a745;
        color: #fff;
      }
      #stopBtn {
        background: #dc3545;
        color: #fff;
      }
      #downloadSeedBtn {
        background: #6f42c1;
        color: #fff;
      }
      #downloadRawBtn {
        background: #007bff;
        color: #fff;
      }
      #resetBtn {
        background: #eaeaea;
        color: #666;
        font-size: 11px;
        margin-top: 14px;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:active {
        transform: scale(0.99);
      }
    </style>
  </head>
  <body>
    <h3>🕵️ Shein Product Extractor (Celebs Edition)</h3>

    <div class="config-card">
      <div class="row">
        <label>Category Matching:</label>
        <span class="badge">Auto-Maps to Celebs DB</span>
      </div>
      <div class="row">
        <label for="usdRate">USD → NPR Rate:</label>
        <input type="number" id="usdRate" value="135" min="50" max="250" />
      </div>
      <div class="row">
        <label for="markup">Landed / Margin Multiplier:</label>
        <input type="number" id="markup" value="1.15" step="0.05" min="1.0" max="2.0" />
      </div>
      <div class="row">
        <label for="defaultStock">Initial Stock / SKU:</label>
        <input type="number" id="defaultStock" value="30" min="0" max="999" />
      </div>
      <div class="row">
        <label for="startOffset">Start Product #:</label>
        <input type="number" id="startOffset" value="1" min="1" />
      </div>
      <div class="row">
        <label for="batchSize">Batch Size:</label>
        <input type="number" id="batchSize" value="5" min="1" max="25" />
      </div>
    </div>

    <div id="status" class="status">
      Navigate to a Shein category page and click Collect Product Links.
    </div>

    <button id="collectBtn">1. Collect Product Links</button>
    <button id="startBtn" style="display: none">2. Start Auto-Batch</button>
    <button id="stopBtn" style="display: none">Pause Execution</button>

    <button id="downloadSeedBtn" style="display: none">📥 Download Celebs Seed JSON</button>
    <button id="downloadRawBtn" style="display: none">📄 Download Raw Scraped JSON</button>

    <button id="resetBtn">Clear & Reset Queue</button>

    <script src="popup.js"></script>
  </body>
</html>
